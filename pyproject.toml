[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobhunt"
version = "1.0.0"
description = "Async job & internship aggregator for CS students"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "pydantic>=2.5",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
jobhunt = "jobhunt.cli:main"

[tool.setuptools.packages.find]
include = ["jobhunt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
